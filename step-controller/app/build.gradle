plugins { id 'com.android.application' }
android {
    namespace 'dev.local.stepcontroller'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.local.stepcontroller'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    buildTypes { release { minifyEnabled false } }
}
dependencies { compileOnly files('libs/xposed-api-82.jar') }
